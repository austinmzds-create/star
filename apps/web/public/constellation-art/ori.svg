      <path d="M 138 53 L 138 79 M 125 66 L 151 66 M 297 78 L 297 100 M 286 89 L 308 89 M 214 257 L 214 273 M 206 265 L 222 265 M 238 242 L 238 258 M 230 250 L 246 250 M 260 222 L 260 238 M 252 230 L 268 230 M 177 419 L 177 441 M 166 430 L 188 430 M 352 388 L 352 410 M 341 399 L 363 399"/>
