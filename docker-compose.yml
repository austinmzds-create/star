version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: star
      POSTGRES_USER: star
      POSTGRES_PASSWORD: star_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql+psycopg://star:star_dev_only@db:5432/star
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
